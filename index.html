<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DMART — Self-Hosted Structured Data Platform</title>
    <meta name="description" content="DMART is a self-hosted, structured information platform. One binary, JSON Schema payloads, files you own — running in 106 MB alongside PostgreSQL on a 416 MB board." />
    <link rel="canonical" href="https://dmart.cc/" />

    <!-- Open Graph / Twitter. Without these, dmart.cc pasted into Slack,
         LinkedIn or X rendered as a bare link: no title card, no description,
         no image. These are static, so they describe the site as a whole --
         per-route cards would need prerendering, which this SPA does not do. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DMART" />
    <meta property="og:url" content="https://dmart.cc/" />
    <meta property="og:title" content="DMART — Self-Hosted Structured Data Platform" />
    <meta property="og:description" content="Schema, access control, workflows and an admin UI in one binary, with your entries stored as files you own. Runs in 106 MB alongside PostgreSQL on a 416 MB board." />
    <meta property="og:image" content="https://dmart.cc/og-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DMART — a structured information platform you run yourself. 46 MB one binary, 106 MB full stack idle, 4 client SDKs, up to 300M entries." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DMART — Self-Hosted Structured Data Platform" />
    <meta name="twitter:description" content="Schema, access control, workflows and an admin UI in one binary, with your entries stored as files you own." />
    <meta name="twitter:image" content="https://dmart.cc/og-card.png" />

    <meta name="theme-color" content="#7c5cf5" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
