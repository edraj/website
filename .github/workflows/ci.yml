# Proves the whole loop on every pull request: the `website` pack installs
# into a fresh dmart, an anonymous visitor can read it through the public API,
# and the site builds from what that API returns — every page real HTML with
# its content in the markup, nothing that needs 'unsafe-inline'.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # The dmart the site is built against in CI: the newest release in the RPM
  # repository at packages.imx.sh, the same Fedora package dmart.cc's API runs.
  # dnf checks the repository's metadata and the package against dmart's
  # signing key, and the key is pinned by its fingerprint. Nothing to move
  # along with dmart: a release that breaks the site shows up here.
  DMART_REPO: "https://packages.imx.sh"
  DMART_KEY_FINGERPRINT: "928487D2599079CC2B2D67984FDF58FB6E9F83BD"
  DMART_URL: "http://127.0.0.1:8282"
  # Throwaway admin of a dmart that lives for one job on localhost — not a
  # secret, and it guards nothing.
  DMART_ADMIN_PASSWORD: "Ci-throwaway-admin-1"

jobs:
  site:
    name: pack → dmart → site
    runs-on: ubuntu-latest
    # Fedora, like the hosts dmart runs on, so the job installs the RPM.
    container: registry.fedoraproject.org/fedora:44
    timeout-minutes: 15
    steps:
      # git for a real checkout, tar and xz for setup-node's download, gnupg2
      # for the key check; the rest the steps below call.
      - name: Tools
        run: dnf -y -q --setopt=install_weak_deps=False install git-core tar gzip xz gnupg2 python3 openssl findutils

      # Pinned by commit SHA rather than tag, matching the convention in
      # edraj/csdmart: a mutable tag can be repointed at new code by anyone
      # who controls the action's repository, and CI runs with a token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Yarn 1, which app/yarn.lock is written for; Fedora's image has none.
      - name: Yarn
        run: npm install -g yarn@1.22.22

      - name: Install the newest dmart
        # Installing it starts nothing: the next step runs its own server.
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/dmart.asc"
          curl -fsSL -o "$key" "$DMART_REPO/dmart.asc"
          fpr="$(gpg --show-keys --with-colons "$key" | awk -F: '$1 == "fpr" { print $10; exit }')"
          if [ "$fpr" != "$DMART_KEY_FINGERPRINT" ]; then
            echo "dmart.asc has fingerprint $fpr, expected $DMART_KEY_FINGERPRINT"; exit 1
          fi
          rpm --import "$key"
          printf '%s\n' '[dmart]' 'name=dmart' "baseurl=$DMART_REPO/rpm/fc44/x86_64" \
            'gpgcheck=1' 'repo_gpgcheck=1' "gpgkey=file://$key" > /etc/yum.repos.d/dmart.repo
          dnf -y -q --setopt=install_weak_deps=False install dmart
          echo "Installed $(rpm -q dmart)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "DMART_BIN=/usr/bin/dmart" >> "$GITHUB_ENV"

      - name: Start a throwaway dmart (SQLite)
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/dmart"; mkdir -p "$d"
          printf '%s\n' \
            'LISTENING_HOST="127.0.0.1"' 'LISTENING_PORT=8282' 'DATABASE_DRIVER="sqlite"' \
            "SQLITE_PATH=\"$d/dmart.db\"" "JWT_SECRET=\"$(openssl rand -hex 32)\"" \
            > "$d/config.env"
          chmod 600 "$d/config.env"
          # dmart never reads ./config.env from the working directory.
          echo "BACKEND_ENV=$d/config.env" >> "$GITHUB_ENV"
          cd "$d"
          BACKEND_ENV="$d/config.env" Dmart__AdminPassword="$DMART_ADMIN_PASSWORD" nohup "$DMART_BIN" serve > server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null "$DMART_URL/" && exit 0; sleep 1; done
          echo "dmart did not come up"; cat server.log; exit 1

      - name: Install the website pack (public)
        run: pack/install.sh --public

      - name: Install site dependencies
        working-directory: app
        # --frozen-lockfile: a PR that edits package.json without regenerating
        # yarn.lock fails here instead of resolving to different versions.
        run: yarn install --frozen-lockfile

      - name: Build the site from dmart's public API
        working-directory: app
        run: yarn build

      - name: Type-check
        working-directory: app
        run: yarn run typecheck

      - name: Verify the built pages
        working-directory: app
        run: yarn verify

      - name: dmart log
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/dmart/server.log" || true
